services:
  db:
    image: postgis/postgis:16-3.4
    container_name: parcel-enrichment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parcels
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parcels"]
      interval: 2s
      timeout: 3s
      retries: 30
